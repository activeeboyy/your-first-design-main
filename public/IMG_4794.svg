<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Windows Taskbar Strip at Top -->
  <rect width="1200" height="44" fill="#1c1c1e"/>
  <!-- Red accent bar indicator -->
  <rect x="0" y="38" width="800" height="6" fill="#ff0033"/>

  <!-- Taskbar elements -->
  <g fill="#FFFFFF" font-size="14" opacity="0.9">
    <!-- Windows icon -->
    <g transform="translate(12, 10)" fill="#FFFFFF">
      <rect x="0" y="0" width="8" height="8"/>
      <rect x="10" y="0" width="8" height="8"/>
      <rect x="0" y="10" width="8" height="8"/>
      <rect x="10" y="10" width="8" height="8"/>
    </g>
    <!-- Search box -->
    <rect x="42" y="6" width="210" height="28" rx="4" fill="#2c2c2e"/>
    <text x="75" y="25" fill="#8e8e93" font-size="13">Type here to search</text>
    <!-- Taskbar app icons -->
    <g transform="translate(265, 8)">
      <rect x="0" y="0" width="24" height="24" rx="4" fill="#0078d4"/>
      <circle cx="42" cy="12" r="10" fill="#00a4ef"/>
      <rect x="64" y="0" width="22" height="22" rx="4" fill="#f25022"/>
      <rect x="94" y="0" width="22" height="22" rx="4" fill="#ffb900"/>
      <circle cx="134" cy="12" r="10" fill="#0066b2"/>
      <rect x="156" y="0" width="22" height="22" rx="4" fill="#001e36"/>
      <text x="160" y="16" font-size="12" fill="#31a8ff" font-weight="bold">Ps</text>
      <rect x="188" y="0" width="22" height="22" rx="4" fill="#d24726"/>
      <circle cx="228" cy="12" r="10" fill="#25d366"/>
    </g>
    <!-- Right tray -->
    <text x="880" y="26" fill="#FFFFFF" font-size="13">27°C</text>
    <text x="1100" y="20" fill="#FFFFFF" font-size="12" font-weight="600">8:02 PM</text>
    <text x="1090" y="36" fill="#8e8e93" font-size="11">10/13/2026</text>
  </g>

  <!-- YouTube Live Chat Card (White modal with rounded top corners) -->
  <g transform="translate(0, 44)">
    <!-- Card Background -->
    <rect width="1200" height="756" rx="24" fill="#FFFFFF"/>

    <!-- Top Drag Handle -->
    <rect x="540" y="16" width="120" height="8" rx="4" fill="#d1d5db"/>

    <!-- Header Section -->
    <g transform="translate(48, 80)">
      <text x="0" y="15" fill="#0F0F0F" font-size="56" font-weight="900" letter-spacing="-1">Live chat</text>
      
      <!-- Subtitle: Top messages & counter -->
      <g transform="translate(0, 52)">
        <text x="0" y="0" fill="#0F0F0F" font-size="28" font-weight="600">Top messages</text>
        <!-- Person Silhouette Icon -->
        <g transform="translate(205, -18)">
          <circle cx="12" cy="6" r="6" fill="none" stroke="#0F0F0F" stroke-width="2.5"/>
          <path d="M2,24 C2,16 6,14 12,14 C18,14 22,16 22,24" fill="none" stroke="#0F0F0F" stroke-width="2.5"/>
        </g>
        <text x="240" y="0" fill="#0F0F0F" font-size="30" font-weight="700">36</text>
      </g>

      <!-- Top Fans Pill Button -->
      <g transform="translate(590, -32)">
        <rect x="0" y="0" width="240" height="68" rx="34" fill="none" stroke="#0F0F0F" stroke-width="2"/>
        <!-- Crown Icon -->
        <g transform="translate(28, 20)">
          <path d="M4,24 L0,8 L10,14 L16,2 L22,14 L32,8 L28,24 Z" fill="none" stroke="#0F0F0F" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
        <text x="75" y="44" fill="#0F0F0F" font-size="26" font-weight="700">Top Fans</text>
      </g>

      <!-- Settings Gear Icon -->
      <g transform="translate(890, -18)">
        <circle cx="24" cy="24" r="14" fill="none" stroke="#0F0F0F" stroke-width="3.5"/>
        <path d="M24,2 L24,8 M24,40 L24,46 M2,24 L8,24 M40,24 L46,24 M8,8 L13,13 M35,35 L40,40 M8,40 L13,35 M35,13 L40,8" stroke="#0F0F0F" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <!-- Close X Icon -->
      <g transform="translate(1045, -18)">
        <path d="M8,8 L36,36 M36,8 L8,36" stroke="#0F0F0F" stroke-width="4.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Chat Messages Stream -->
    <!-- Message 1: @nnenna_100 -->
    <g transform="translate(48, 240)">
      <!-- Avatar -->
      <circle cx="36" cy="36" r="36" fill="#e0e7ff"/>
      <circle cx="36" cy="24" r="14" fill="#4f46e5" opacity="0.8"/>
      <path d="M16,56 C16,42 22,38 36,38 C50,38 56,42 56,56" fill="#4f46e5" opacity="0.8"/>

      <!-- Content -->
      <text x="98" y="32" fill="#606060" font-size="32" font-weight="700">@nnenna_100</text>
      <text x="400" y="32" fill="#0F0F0F" font-size="32" font-weight="500">The class is impactful. I&apos;m learning a</text>
      <text x="98" y="78" fill="#0F0F0F" font-size="32" font-weight="500">lot already <tspan font-size="34">🙂</tspan></text>
    </g>

    <!-- Message 2: @EdafeogheneDaniel (Top Fan #2) -->
    <g transform="translate(48, 360)">
      <!-- Dark Avatar -->
      <circle cx="36" cy="36" r="36" fill="#0F0F0F"/>
      <circle cx="36" cy="24" r="12" fill="#333333"/>
      <path d="M18,54 C18,42 24,38 36,38 C48,38 54,42 54,54" fill="#333333"/>

      <!-- Username -->
      <text x="98" y="46" fill="#606060" font-size="32" font-weight="700">@EdafeogheneDaniel</text>
      
      <!-- Top Fan #2 Purple Badge -->
      <g transform="translate(520, 10)">
        <rect width="135" height="52" rx="26" fill="#6a1b9a"/>
        <!-- Mini Crown -->
        <path d="M24,32 L20,20 L27,24 L31,16 L35,24 L42,20 L38,32 Z" fill="#FFFFFF"/>
        <text x="54" y="36" fill="#FFFFFF" font-size="24" font-weight="800">#2</text>
      </g>

      <!-- Emoji: Taking Notes ✍️ x 5 -->
      <text x="700" y="48" font-size="38">✍️✍️✍️✍️✍️</text>
    </g>

    <!-- Message 3: @annegren21 -->
    <g transform="translate(48, 480)">
      <!-- Avatar -->
      <circle cx="36" cy="36" r="36" fill="#d1d5db"/>
      <circle cx="36" cy="24" r="13" fill="#4b5563"/>
      <path d="M18,54 C18,42 24,38 36,38 C48,38 54,42 54,54" fill="#4b5563"/>

      <text x="98" y="46" fill="#606060" font-size="32" font-weight="700">@annegren21</text>
      <text x="390" y="46" fill="#0F0F0F" font-size="32" font-weight="500">I&apos;m learning sir <tspan font-size="36">🔥</tspan></text>
    </g>

    <!-- Message 4: @funnyentertainment8159 -->
    <g transform="translate(48, 600)">
      <!-- Purple Letter Avatar F -->
      <circle cx="36" cy="36" r="36" fill="#6a1b9a"/>
      <text x="36" y="48" fill="#FFFFFF" font-size="38" font-weight="800" text-anchor="middle">F</text>

      <text x="98" y="46" fill="#606060" font-size="32" font-weight="700">@funnyentertainment8159</text>
      <!-- Flowers 🌺 x 3 -->
      <text x="650" y="48" font-size="38">🌺🌺🌺</text>
    </g>

    <!-- Message 5: @EdafeogheneDaniel (Top Fan #2 repeated) -->
    <g transform="translate(48, 715)">
      <circle cx="36" cy="36" r="36" fill="#0F0F0F"/>
      <circle cx="36" cy="24" r="12" fill="#333333"/>
      <path d="M18,54 C18,42 24,38 36,38 C48,38 54,42 54,54" fill="#333333"/>

      <text x="98" y="46" fill="#606060" font-size="32" font-weight="700">@EdafeogheneDaniel</text>
      <g transform="translate(520, 10)">
        <rect width="135" height="52" rx="26" fill="#6a1b9a"/>
        <path d="M24,32 L20,20 L27,24 L31,16 L35,24 L42,20 L38,32 Z" fill="#FFFFFF"/>
        <text x="54" y="36" fill="#FFFFFF" font-size="24" font-weight="800">#2</text>
      </g>
      <text x="700" y="48" font-size="38">✍️✍️✍️✍️</text>
    </g>
  </g>
</svg>